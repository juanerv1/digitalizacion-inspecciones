services:
  database:
    image: postgres:16
    container_name: digitacionDatabase
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "2000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: 
      # "." significa "esta misma carpeta"
      context: ./backend 
      dockerfile: Dockerfile
    container_name: digitacionBackend
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DATABASE_URL: ${DATABASE_URL}
    restart: always
    env_file:
      - .env
    volumes:
      # Enlazamos la carpeta del backend (donde está alembic.ini) con /app
      - ./backend:/app:z
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  frontend:
    image: node:22-alpine
    container_name: digitacionFrontend
    working_dir: /app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    volumes:
      - ./frontend:/app:z
      # Evita que el node_modules del host pise el del contenedor
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    restart: always
    env_file:
      - .env

volumes:
  pgdata:
  frontend_node_modules: